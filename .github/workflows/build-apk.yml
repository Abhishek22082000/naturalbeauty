name: Build Android APK

# Builds the Flutter app on GitHub's servers so no local Flutter SDK is
# needed. Download the finished APK from the run's Artifacts section.
on:
  push:
    branches: [main, flutter]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo holds only lib/, pubspec.yaml and the Android files we
      # care about. This generates the rest of the standard Flutter
      # scaffolding (gradle files, MainActivity, iOS project) around them.
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          mkdir -p /tmp/keep
          cp -r android /tmp/keep/android
          flutter create --project-name naturalbeauty --platforms=android .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp -rf /tmp/keep/android/. android/

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naturalbeauty-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
